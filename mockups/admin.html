<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ACE PL — Admin Mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Grotesk:wght@400;500;700&family=Inter:wght@500;600&display=swap" rel="stylesheet">
<style>
  [data-mode="light"] {
    --bg: #f1f1ee; --surface: #fff; --surface2: #e9e9e4; --line: #111; --soft: #d6d6d0;
    --text: #0e0e0e; --muted: #5d5d5d; --accent: #d4ff00; --on-accent: #0e0e0e; --hot: #ff3d00; --shadow: #111; --ok: #1a8a3a;
  }
  [data-mode="dark"] {
    --bg: #0b0b0b; --surface: #161616; --surface2: #222; --line: #f1f1ee; --soft: #333;
    --text: #f1f1ee; --muted: #9a9a9a; --accent: #d4ff00; --on-accent: #0e0e0e; --hot: #ff3d00; --shadow: #d4ff00; --ok: #7bdc5a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { min-height: 100vh; background: #2a2d34; font-family: "Inter", sans-serif; display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 20px 12px 40px; }
  .top { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; align-items: center; }
  .top h1 { width: 100%; text-align: center; color: #c9ccd3; font-size: 15px; font-weight: 600; }
  .top button, .top a { border: 1px solid #4a4f5a; background: #1d2026; color: #ddd; padding: 8px 14px; border-radius: 999px; font: 600 13px "Inter"; cursor: pointer; text-decoration: none; }

  .phone { width: 390px; max-width: 100%; height: 820px; border-radius: 44px; overflow: hidden; background: var(--bg); color: var(--text);
    font-family: "Space Grotesk", sans-serif; box-shadow: 0 0 0 10px #111, 0 30px 60px #0008; display: flex; flex-direction: column; }
  @media (max-width: 430px) { .phone { height: calc(100vh - 110px); border-radius: 0; box-shadow: none; } body { padding: 10px 0; } }
  .status { height: 40px; flex: none; display: flex; justify-content: space-between; align-items: center; padding: 0 28px; font-size: 13px; font-weight: 700; }
  .bar { flex: none; display: flex; align-items: center; gap: 10px; padding: 2px 16px 12px; }
  .logo { font-family: "Anton"; font-size: 24px; letter-spacing: .02em; }
  .logo span { background: var(--accent); color: #000; padding: 0 4px; }
  .admin-tag { font-size: 10px; font-weight: 700; letter-spacing: .14em; background: var(--hot); color: #fff; padding: 3px 7px; }
  .content { flex: 1; overflow-y: auto; padding: 0 14px 24px; scrollbar-width: none; }
  .content::-webkit-scrollbar { display: none; }
  .nav { flex: none; display: flex; justify-content: space-around; padding: 10px 4px 22px; background: var(--surface); border-top: 2px solid var(--line); }
  .nav button { background: none; border: none; color: var(--muted); font: 700 11px "Space Grotesk"; display: flex; flex-direction: column; align-items: center; gap: 3px; cursor: pointer; width: 76px; }
  .nav button .ni { font-size: 18px; filter: grayscale(1); opacity: .7; }
  .nav button.active { color: var(--text); }
  .nav button.active .ni { filter: none; opacity: 1; }
  .nav button.active .lbl { border-bottom: 2px solid var(--accent); }

  .h { font-family: "Anton"; text-transform: uppercase; letter-spacing: .02em; }
  .sec { display: flex; justify-content: space-between; align-items: baseline; margin: 20px 2px 8px; }
  .sec .h { font-size: 17px; }
  .sec small { font-size: 11px; color: var(--muted); font-weight: 600; }
  .card { background: var(--surface); border: 2px solid var(--line); box-shadow: 4px 4px 0 var(--shadow); padding: 12px; }
  .muted { color: var(--muted); }
  .hint { font-size: 11px; color: var(--muted); margin-top: 8px; line-height: 1.4; }
  .crest { width: 24px; height: 24px; display: inline-grid; place-items: center; font: 800 10px "Inter"; color: #fff; flex: none; }

  .scoreboard { display: flex; align-items: center; justify-content: space-between; background: #0e0e0e; color: #fff; padding: 14px; border: 2px solid var(--line); box-shadow: 4px 4px 0 var(--hot); }
  .scoreboard .t { display: flex; flex-direction: column; align-items: center; gap: 6px; width: 90px; font-weight: 700; font-size: 13px; }
  .scoreboard .t .crest { width: 36px; height: 36px; font-size: 14px; }
  .scoreboard .s { font-family: "Anton"; font-size: 44px; color: var(--accent); letter-spacing: .04em; }
  .scoreboard .meta { text-align: center; }
  .scoreboard .meta small { display: block; font-size: 10px; color: #aaa; font-weight: 700; letter-spacing: .1em; }

  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .col-h { display: flex; align-items: center; gap: 6px; font-weight: 700; font-size: 13px; margin-bottom: 8px; }
  .pchip { display: flex; align-items: center; gap: 6px; padding: 7px 8px; border: 2px solid var(--line); margin-bottom: 6px; font-size: 12px; font-weight: 700; cursor: pointer; background: var(--surface); user-select: none; }
  .pchip.off { opacity: .35; text-decoration: line-through; border-style: dashed; }
  .pchip .pos { font-size: 9px; font-weight: 800; background: var(--surface2); padding: 2px 4px; }
  .pchip .gk { margin-left: auto; font-size: 13px; opacity: .25; cursor: pointer; }
  .pchip .gk.on { opacity: 1; }
  .pchip .bor { font-size: 8px; font-weight: 800; background: var(--hot); color: #fff; padding: 2px 4px; margin-left: auto; }
  .pchip .bor + .gk { margin-left: 4px; }

  select, input { font: 600 13px "Space Grotesk"; background: var(--surface); color: var(--text); border: 2px solid var(--line); padding: 7px 6px; border-radius: 0; width: 100%; }
  .row { display: flex; gap: 6px; align-items: center; margin-bottom: 8px; }
  .row > .grow { flex: 1; min-width: 0; }
  .x { background: none; border: 2px solid var(--line); color: var(--text); width: 32px; height: 34px; font-weight: 800; cursor: pointer; flex: none; }
  .btn { display: block; width: 100%; padding: 12px; border: 2px solid var(--line); background: var(--accent); color: var(--on-accent); font: 700 14px "Space Grotesk"; cursor: pointer; box-shadow: 3px 3px 0 var(--shadow); }
  .btn.ghost { background: var(--surface); color: var(--text); }
  .btn.hot { background: var(--hot); color: #fff; }
  .btn.sm { padding: 8px; font-size: 12px; box-shadow: none; }
  .btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

  .stepper { display: flex; align-items: center; border: 2px solid var(--line); }
  .stepper button { width: 34px; height: 34px; border: none; background: var(--surface2); color: var(--text); font: 800 18px "Space Grotesk"; cursor: pointer; }
  .stepper b { width: 36px; text-align: center; font-family: "Anton"; font-size: 18px; }
  .kp { display: flex; align-items: center; justify-content: space-between; padding: 8px 0; border-top: 1px dashed var(--soft); font-size: 13px; font-weight: 700; }
  .kp:first-child { border-top: none; }
  .seg { display: flex; border: 2px solid var(--line); flex: none; }
  .seg button { border: none; background: var(--surface); padding: 0 9px; height: 30px; cursor: pointer; font-size: 14px; }
  .seg button.on { background: var(--accent); }

  .auto { background: var(--surface2); border: 2px dashed var(--line); padding: 10px 12px; font-size: 12px; line-height: 1.7; }
  .auto b { font-weight: 800; }
  .warn { color: var(--hot); font-weight: 700; font-size: 12px; margin-top: 6px; }
  .okt { color: var(--ok); font-weight: 700; }
  .toast { position: sticky; bottom: 0; margin-top: 12px; background: #0e0e0e; color: var(--accent); padding: 12px; font-weight: 700; font-size: 13px; border: 2px solid var(--accent); display: none; }

  .fx { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-top: 1px dashed var(--soft); font-size: 13px; font-weight: 700; }
  .fx:first-child { border-top: none; }
  .fx .time { font-family: "Anton"; font-size: 14px; width: 44px; }
  .fx .teams { flex: 1; display: flex; align-items: center; gap: 5px; }
  .fx .mv { display: flex; gap: 3px; }
  .fx .mv button { width: 26px; height: 26px; border: 2px solid var(--line); background: var(--surface); color: var(--text); cursor: pointer; font-weight: 800; }
  .pill { font-size: 10px; font-weight: 800; padding: 3px 7px; background: var(--surface2); border: 1px solid var(--line); letter-spacing: .06em; }
  .pill.ok { background: var(--accent); color: #000; }
  .pill.hot { background: var(--hot); color: #fff; border-color: var(--hot); }
  .cfg { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .cfg label { font-size: 10px; font-weight: 800; letter-spacing: .08em; color: var(--muted); display: block; margin-bottom: 3px; }

  .fraud { padding: 10px; background: repeating-linear-gradient(-45deg, #ffcc00 0 12px, #111 12px 24px); }
  .fraud .inner { background: var(--surface); border: 2px solid var(--line); padding: 10px; display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .fraud .inner:last-child { margin-bottom: 0; }
  .fraud .empty { border-style: dashed; justify-content: center; color: var(--muted); font-weight: 700; font-size: 13px; cursor: pointer; }
  .weeks { font-family: "Anton"; font-size: 24px; color: var(--hot); margin-left: auto; text-align: center; line-height: 1; }
  .weeks small { display: block; font: 700 9px "Space Grotesk"; color: var(--muted); }
  .av { width: 34px; height: 34px; display: grid; place-items: center; font-weight: 800; font-size: 12px; color: #fff; flex: none; }
  .lr { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px dashed var(--soft); font-size: 13px; }
  .lr:first-child { border-top: none; }
  .lr .n { flex: 1; font-weight: 700; }
  .lr .v { font-family: "Anton"; font-size: 17px; }

  .log { padding: 10px 0; border-top: 1px dashed var(--soft); font-size: 12px; line-height: 1.5; }
  .log:first-child { border-top: none; }
  .log .who { font-weight: 800; }
  .log .when { color: var(--muted); font-size: 11px; }
  .log .diff { margin-top: 4px; font-weight: 700; }
  .log .diff s { color: var(--hot); }
  .log .diff ins { text-decoration: none; background: var(--accent); color: #000; padding: 0 3px; }
  .log .why { color: var(--muted); font-style: italic; margin-top: 2px; }
</style>
</head>
<body>
<div class="top">
  <h1>ACE PL — Admin mockup (Street Volt, fake data, nothing is saved)</h1>
  <a href="index.html">← Fan app mockup</a>
  <button id="mode">🌙 Dark mode</button>
</div>

<div class="phone" id="phone" data-mode="light">
  <div class="status"><span>22:41</span><span>●●● 5G ▮</span></div>
  <div class="bar"><div class="logo">ACE <span>PL</span></div><span class="admin-tag">ADMIN</span></div>
  <div class="content" id="content"></div>
  <nav class="nav">
    <button data-screen="match"><span class="ni">⚽</span><span class="lbl">Match entry</span></button>
    <button data-screen="fixtures"><span class="ni">📅</span><span class="lbl">Fixtures</span></button>
    <button data-screen="fraud"><span class="ni">🏅</span><span class="lbl">Fraud & awards</span></button>
    <button data-screen="log"><span class="ni">📜</span><span class="lbl">Change log</span></button>
  </nav>
</div>

<script>
const TEAMS = {
  VIP: { name: "Vipers", color: "#e63946" }, TIT: { name: "Titans", color: "#1d70b8" },
  SPA: { name: "Spartans", color: "#2a9d8f" }, REB: { name: "Rebels", color: "#f4a100" }, WOL: { name: "Wolves", color: "#2b2d42" },
};
const crest = c => `<span class="crest" style="background:${TEAMS[c].color}">${c[0]}</span>`;

const PEOPLE = [
  ["tunde", "Tunde A.", "VIP", "FWD"], ["marcus", "Marcus L.", "VIP", "GK"], ["ade", "Ade P.", "VIP", "DEF"], ["ola", "Ola S.", "VIP", "DEF"],
  ["ben", "Ben T.", "VIP", "MID"], ["kofi", "Kofi D.", "VIP", "MID"], ["zed", "Zed W.", "VIP", "FWD"], ["mo", "Mo K.", "VIP", "MID"],
  ["kwame", "Kwame O.", "SPA", "FWD"], ["tolu", "Tolu G.", "SPA", "GK"], ["leon", "Leon B.", "SPA", "DEF"], ["ryan", "Ryan H.", "SPA", "DEF"],
  ["ike", "Ike C.", "SPA", "MID"], ["dele", "Dele F.", "SPA", "MID"], ["nate", "Nate J.", "SPA", "FWD"], ["paul", "Paul V.", "SPA", "MID"],
  ["sam", "Sam E.", "TIT", "DEF"], ["rico", "Rico M.", "WOL", "FWD"], ["jay", "Jay R.", "REB", "MID"],
].map(([id, n, t, pos]) => ({ id, n, t, pos }));
const byId = id => PEOPLE.find(p => p.id === id);

const M = {
  home: "VIP", away: "SPA",
  lineup: { VIP: ["tunde", "marcus", "ade", "ola", "ben", "kofi", "zed", "mo"], SPA: ["kwame", "tolu", "leon", "ryan", "ike", "dele", "nate", "paul"] },
  off: new Set(["mo"]),
  borrowed: {},
  gk: { VIP: "marcus", SPA: "tolu" },
  goals: [
    { team: "VIP", scorer: "tunde", assist: "ben" },
    { team: "SPA", scorer: "kwame", assist: "" },
    { team: "VIP", scorer: "tunde", assist: "" },
  ],
  saves: { marcus: 5, tolu: 7 }, pens: { marcus: 0, tolu: 1 },
  cards: [{ player: "ike", type: "Y" }],
  motm: "tunde",
};

const played = team => M.lineup[team].filter(id => !M.off.has(id));
const score = team => M.goals.filter(g => g.team === team).length;
const other = team => team === M.home ? M.away : M.home;
const opts = (ids, sel, blank) => (blank !== undefined ? `<option value="">${blank}</option>` : "") +
  ids.map(id => `<option value="${id}" ${id === sel ? "selected" : ""}>${byId(id).n}</option>`).join("");

function stepper(key, id) {
  return `<div class="stepper"><button data-step="${key}:${id}:-1">−</button><b>${M[key][id] || 0}</b><button data-step="${key}:${id}:1">+</button></div>`;
}

function lineupCol(team) {
  return `<div><div class="col-h">${crest(team)}${TEAMS[team].name}</div>
    ${M.lineup[team].map(id => {
      const p = byId(id), off = M.off.has(id);
      return `<div class="pchip ${off ? "off" : ""}" data-toggle="${id}">
        <span class="pos">${p.pos}</span>${p.n}
        ${M.borrowed[id] ? `<span class="bor">FROM ${p.t}</span>` : ""}
        <span class="gk ${M.gk[team] === id ? "on" : ""}" data-gk="${team}:${id}" title="Goalkeeper">🧤</span></div>`;
    }).join("")}
    <select data-borrow="${team}"><option value="">+ Borrow player</option>
      ${PEOPLE.filter(p => !M.lineup.VIP.includes(p.id) && !M.lineup.SPA.includes(p.id)).map(p => `<option value="${p.id}">${p.n} (${TEAMS[p.t].name})</option>`).join("")}
    </select></div>`;
}

function autoSummary() {
  const lines = [];
  for (const team of [M.home, M.away]) {
    const conceded = score(other(team));
    const keeper = byId(M.gk[team]);
    const defs = played(team).filter(id => byId(id).pos === "DEF").map(id => byId(id).n);
    lines.push(conceded === 0
      ? `🧱 <b>${TEAMS[team].name} clean sheet</b>: ${keeper.n} (GK)${defs.length ? ", " + defs.join(", ") : ""}`
      : `🥅 <b>${TEAMS[team].name}</b> conceded ${conceded}: ${keeper.n} (GK)${defs.length ? ", " + defs.join(", ") : ""}`);
  }
  const borrowed = Object.keys(M.borrowed).map(id => `${byId(id).n} played for ${TEAMS[M.borrowed[id]].name}, still registered to ${TEAMS[byId(id).t].name}`);
  return lines.concat(borrowed.map(b => `🔁 ${b}`)).join("<br>");
}

const SCREENS = {
  match: () => {
    const missing = M.goals.filter(g => !g.scorer).length;
    return `
    <div class="sec" style="margin-top:2px"><span class="h">GW3 · Match 2 of 5</span><small>Fri 20 Nov · 19:25</small></div>
    <div class="scoreboard">
      <div class="t">${crest(M.home)}${TEAMS[M.home].name}</div>
      <div class="meta"><div class="s">${score(M.home)}–${score(M.away)}</div><small>AUTO FROM GOALS</small></div>
      <div class="t">${crest(M.away)}${TEAMS[M.away].name}</div>
    </div>

    <div class="sec"><span class="h">1 · Who played</span><small>Tap = absent · 🧤 = keeper</small></div>
    <div class="card"><div class="cols">${lineupCol(M.home)}${lineupCol(M.away)}</div>
      <div class="hint">Everyone in the squad is ticked by default. Just tap who didn't show. Borrowed players get a tag; their stats stay theirs.</div></div>

    <div class="sec"><span class="h">2 · Goals</span><small>Score updates itself</small></div>
    <div class="card">
      ${M.goals.map((g, i) => `<div class="row">${crest(g.team)}
        <div class="grow"><select data-goal="${i}:scorer">${opts(played(g.team), g.scorer, "Scorer…")}<option value="og:${other(g.team)}" ${g.scorer.startsWith("og:") ? "selected" : ""}>Own goal (${TEAMS[other(g.team)].name})</option></select></div>
        <div class="grow"><select data-goal="${i}:assist">${opts(played(g.team).filter(id => id !== g.scorer), g.assist, "No assist")}</select></div>
        <button class="x" data-delgoal="${i}">×</button></div>`).join("")}
      ${missing ? `<div class="warn">${missing} goal(s) still need a scorer</div>` : ""}
      <div class="btns" style="margin-top:6px">
        <button class="btn sm ghost" data-addgoal="${M.home}">+ ${TEAMS[M.home].name} goal</button>
        <button class="btn sm ghost" data-addgoal="${M.away}">+ ${TEAMS[M.away].name} goal</button>
      </div>
    </div>

    <div class="sec"><span class="h">3 · Keepers</span><small>±1 is fine</small></div>
    <div class="card">
      ${[M.home, M.away].map(t => { const id = M.gk[t]; return `
        <div class="kp"><span>${crest(t)} ${byId(id).n}</span><span class="muted" style="font-size:11px">SAVES</span>${stepper("saves", id)}</div>
        <div class="kp"><span></span><span class="muted" style="font-size:11px">PEN SAVES</span>${stepper("pens", id)}</div>`; }).join("")}
    </div>

    <div class="sec"><span class="h">4 · Cards</span><small>Recorded only</small></div>
    <div class="card">
      ${M.cards.map((c, i) => `<div class="row">
        <div class="grow"><select data-card="${i}">${opts([...played(M.home), ...played(M.away)], c.player, "Player…")}</select></div>
        <div class="seg"><button class="${c.type === "Y" ? "on" : ""}" data-cardtype="${i}:Y">🟨</button><button class="${c.type === "R" ? "on" : ""}" data-cardtype="${i}:R">🟥</button></div>
        <button class="x" data-delcard="${i}">×</button></div>`).join("")}
      <button class="btn sm ghost" data-addcard>+ Card</button>
    </div>

    <div class="sec"><span class="h">5 · Man of the match</span></div>
    <div class="card"><select data-motm>${opts([...played(M.home), ...played(M.away)], M.motm, "Pick MOTM…")}</select></div>

    <div class="sec"><span class="h">Worked out automatically</span></div>
    <div class="auto">${autoSummary()}</div>

    <div style="margin-top:16px" class="btns">
      <button class="btn ghost" data-save="draft">Save draft</button>
      <button class="btn" data-save="final">✔ Save result</button>
    </div>
    <div class="toast" id="toast"></div>`;
  },

  fixtures: () => {
    const days = [
      ["GW1 · Fri 6 Nov", [["VIP","TIT"],["SPA","REB"],["WOL","VIP"],["TIT","SPA"],["REB","WOL"]], "ok"],
      ["GW2 · Fri 13 Nov", [["VIP","SPA"],["TIT","REB"],["SPA","WOL"],["REB","VIP"],["WOL","TIT"]], "ok"],
      ["GW3 · Fri 20 Nov", [["TIT","VIP"],["REB","SPA"],["VIP","WOL"],["SPA","TIT"],["WOL","REB"]], "draft"],
      ["GW4 · Fri 27 Nov", [["SPA","VIP"],["REB","TIT"],["WOL","SPA"],["VIP","REB"],["TIT","WOL"]], "draft"],
    ];
    const times = ["19:00", "19:25", "19:50", "20:15", "20:40"];
    return `
    <div class="sec" style="margin-top:2px"><span class="h">Generate fixtures</span><small>November Cup</small></div>
    <div class="card">
      <div class="cfg">
        <div><label>TEAMS</label><select><option>4</option><option selected>5</option><option>6</option></select></div>
        <div><label>MATCHES / FRIDAY</label><select><option>4</option><option selected>5</option><option>6</option></select></div>
        <div><label>MATCH LENGTH</label><select><option selected>20 min</option><option>15 min</option></select></div>
        <div><label>GAP BETWEEN</label><select><option selected>5 min</option><option>10 min</option></select></div>
        <div style="grid-column:span 2"><label>FORMAT</label><select><option selected>Everyone plays everyone twice</option><option>Everyone plays everyone once</option></select></div>
        <div style="grid-column:span 2"><label>GAME DAYS</label><input value="Fri 6 Nov, 13 Nov, 20 Nov, 27 Nov"></div>
      </div>
      <div class="hint">Rules the generator follows: every team plays the same number of games each Friday, nobody plays back-to-back, home/away flipped in the second round.</div>
      <button class="btn" style="margin-top:10px">⚡ Generate</button>
    </div>

    ${days.map(([label, ms, st]) => `
      <div class="sec"><span class="h">${label}</span><span class="pill ${st === "ok" ? "ok" : ""}">${st === "ok" ? "PUBLISHED" : "DRAFT"}</span></div>
      <div class="card">${ms.map((m, i) => `<div class="fx"><span class="time">${times[i]}</span>
        <span class="teams">${crest(m[0])}${TEAMS[m[0]].name} <span class="muted">v</span> ${TEAMS[m[1]].name}${crest(m[1])}</span>
        ${st === "draft" ? `<span class="mv"><button>↑</button><button>↓</button><button>✎</button></span>` : `<span class="pill">FT</span>`}</div>`).join("")}</div>`).join("")}
    <div style="margin-top:14px"><button class="btn">Publish GW3 + GW4</button></div>`;
  },

  fraud: () => `
    <div class="sec" style="margin-top:2px"><span class="h">Fraud Watch</span><small>Max 2 · admin vibes only</small></div>
    <div class="fraud">
      <div class="inner"><span class="av" style="background:#2b2d42">FO</span>
        <div><b>Femi O.</b><div class="muted" style="font-size:11px">"Apologised in the group chat. Again."</div></div>
        <div class="weeks">6<small>WEEKS</small></div></div>
      <div class="inner empty">+ Add to Fraud Watch</div>
    </div>
    <div class="btns" style="margin-top:10px"><button class="btn sm ghost">✎ Edit caption</button><button class="btn sm hot">Release Femi</button></div>
    <div class="hint">Weeks tick up automatically each Friday a player stays on. Releasing them keeps the stint in their history.</div>

    <div class="sec"><span class="h">Ballon d'Or</span><span class="pill">NOT OPEN</span></div>
    <div class="card">
      <div class="muted" style="font-size:11px;font-weight:700;letter-spacing:.08em;margin-bottom:4px">SHORTLIST · TOP 5 BY FANTASY POINTS</div>
      ${[["Tunde A.", "VIP", 71], ["David K.", "TIT", 66], ["Kwame O.", "SPA", 52], ["Marcus L.", "VIP", 48], ["Jay R.", "REB", 41]].map(([n, t, p], i) => `
        <div class="lr"><span class="v" style="width:16px">${i + 1}</span><span class="av" style="background:${TEAMS[t].color}">${n.split(" ").map(s => s[0]).join("")}</span><span class="n">${n}</span><span class="v">${p}</span></div>`).join("")}
      <div class="cfg" style="margin-top:10px"><div style="grid-column:span 2"><label>VOTING DEADLINE</label><input value="Sun 29 Nov · 21:00"></div></div>
      <button class="btn" style="margin-top:10px">Open voting</button>
      <div class="hint">While voting is open, nobody (admins included) sees the counts, only "27 votes cast". Admin presses Reveal after the deadline.</div>
    </div>

    <div class="sec"><span class="h">Auto awards</span><small>Live preview · ties shared</small></div>
    <div class="card">
      <div class="lr">👟<span class="n">Golden Boot</span><span class="muted">Tunde A.</span><span class="v">9</span></div>
      <div class="lr">🎯<span class="n">Playmaker</span><span class="muted">David K.</span><span class="v">7</span></div>
      <div class="lr">🧤<span class="n">Golden Glove</span><span class="muted">Marcus L.</span><span class="v">3 CS</span></div>
    </div>
    <div style="margin-top:14px"><button class="btn hot">Conclude tournament</button></div>`,

  log: () => `
    <div class="sec" style="margin-top:2px"><span class="h">Change log</span><small>Every edit to results & stats</small></div>
    <div class="card">
      ${[
        ["Kay", "Fri 13 Nov · 22:41", "Vipers v Titans · score", "<s>3–2</s> → <ins>3–3</ins>", "Missed David's last-minute goal"],
        ["Kay", "Fri 13 Nov · 22:43", "Vipers v Titans · goal", "+ <ins>David K.</ins> (ast <ins>Sam E.</ins>)", ""],
        ["Tobi", "Sat 14 Nov · 10:02", "Spartans v Rebels · assist", "<s>Leon B.</s> → <ins>Ike C.</ins>", "Ike says it was him lol"],
        ["Tobi", "Sat 14 Nov · 10:05", "Fraud Watch", "+ <ins>Femi O.</ins>", ""],
        ["Kay", "Mon 16 Nov · 19:30", "Wolves v Vipers · MOTM", "<s>Tunde A.</s> → <ins>Marcus L.</ins>", "Group vote overruled"],
      ].map(([who, when, what, diff, why]) => `
        <div class="log"><span class="who">${who}</span> <span class="when">· ${when}</span>
          <div>${what}</div><div class="diff">${diff}</div>${why ? `<div class="why">"${why}"</div>` : ""}</div>`).join("")}
    </div>
    <div class="hint">Nothing is ever silently overwritten. Each change records who, when, before → after and an optional reason.</div>`,
};

const phone = document.getElementById("phone");
const content = document.getElementById("content");
let screen = "match";

function render() {
  const y = content.scrollTop;
  content.innerHTML = SCREENS[screen]();
  content.scrollTop = y;
  document.querySelectorAll("[data-screen]").forEach(b => b.classList.toggle("active", b.dataset.screen === screen));
}

content.addEventListener("click", e => {
  const t = e.target.closest("[data-gk],[data-toggle],[data-step],[data-addgoal],[data-delgoal],[data-addcard],[data-delcard],[data-cardtype],[data-save]");
  if (!t) return;
  const d = t.dataset;
  if (d.gk) { const [team, id] = d.gk.split(":"); M.gk[team] = id; M.off.delete(id); }
  else if (d.toggle) { M.off.has(d.toggle) ? M.off.delete(d.toggle) : M.off.add(d.toggle); }
  else if (d.step) { const [k, id, n] = d.step.split(":"); M[k][id] = Math.max(0, (M[k][id] || 0) + +n); }
  else if (d.addgoal) M.goals.push({ team: d.addgoal, scorer: "", assist: "" });
  else if (d.delgoal) M.goals.splice(+d.delgoal, 1);
  else if ("addcard" in d) M.cards.push({ player: "", type: "Y" });
  else if (d.delcard) M.cards.splice(+d.delcard, 1);
  else if (d.cardtype) { const [i, ty] = d.cardtype.split(":"); M.cards[+i].type = ty; }
  else if (d.save) {
    render();
    const toast = document.getElementById("toast");
    toast.textContent = d.save === "final"
      ? "✔ Saved. Table, leaderboards and fantasy points updated."
      : "Draft saved. Not visible to fans yet.";
    toast.style.display = "block";
    content.scrollTop = content.scrollHeight;
    return;
  }
  render();
});

content.addEventListener("change", e => {
  const d = e.target.dataset, v = e.target.value;
  if (d.goal) { const [i, f] = d.goal.split(":"); M.goals[+i][f] = v; if (f === "scorer" && M.goals[+i].assist === v) M.goals[+i].assist = ""; }
  else if (d.card) M.cards[+d.card].player = v;
  else if ("motm" in d) M.motm = v;
  else if (d.borrow && v) { M.lineup[d.borrow].push(v); M.borrowed[v] = d.borrow; }
  render();
});

document.querySelectorAll("[data-screen]").forEach(b => b.onclick = () => { screen = b.dataset.screen; content.scrollTop = 0; render(); });
document.getElementById("mode").onclick = e => {
  const dark = phone.dataset.mode === "light";
  phone.dataset.mode = dark ? "dark" : "light";
  e.target.textContent = dark ? "☀️ Light mode" : "🌙 Dark mode";
};
render();
</script>
</body>
</html>
